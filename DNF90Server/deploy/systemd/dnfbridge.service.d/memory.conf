[Service]
# Go heap target. Keep this below the host's 3.7 GiB RAM budget.
Environment=GOMEMLIMIT=2684354560
# Packet logging is a disk/IO diagnostic switch, not a production default.
Environment=DNFBRIDGE_PACKET_LOG=false
# CentOS 7 uses MemoryLimit rather than MemoryMax.
MemoryLimit=3435973836
Restart=on-failure
RestartSec=5s
