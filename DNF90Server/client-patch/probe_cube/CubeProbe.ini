[probe]
; ===========================================================================
; CubeProbe.dll 配置（放在 DNF.exe 同目录，和 CubeProbe.dll 一起）
; 不写这个文件也能跑：所有项都有内置默认值。数值一律十进制（也接受 0x 前缀）。
; ===========================================================================

; 触发号：客户端发出这些 opcode 时，进入全量抓取窗口（arm），并打印调用栈。
;   1119 = 梦想/绝对装扮合成器（本次要查的）
;   99   = 普通装扮合成器（对照组：它是好的，两者日志一比就有差异）
;   63   = 预留（十进制 63；不是 99）
trigger_opcodes=1119, 99

; 关注号：不进 arm 也记它们的收发与包体（合成器家族 / 强化 / 公会金库 / 已知有回包注册的号段）
watch_opcodes=1119, 99, 63, 80, 81, 82, 247, 248, 249, 250, 261, 1100, 1112, 1128, 1133, 45, 46, 47, 48, 49, 50

; arm 窗口长度（秒）。窗口内所有 C2S / S2C / 分发查表全量记录。
arm_seconds=25

; 非 arm 期间：C2S 是否也记一行（只记 opcode 与长度，很小）
log_all_c2s=1
; 非 arm 期间：S2C 是否也记（默认关，只记 watch 表里的号）
log_all_s2c=0

; 包体打印上限：arm/trigger 用 full，其它用 brief
full_body_bytes=512
brief_body_bytes=48

; 调用栈帧数（arm/trigger 时打印）。0 = 不打印。
stack_frames=14

; 分发查表钩子
;   lookup_resolve=1：在钩子里顺手把"这个 opcode 有没有处理器"查出来记上
;                     （纯只读查表，不写任何游戏状态）
;   lookup_log_all=1：所有查表都记（量很大，排查时才开）
;   lookup_log_watch=1：watch 表里的号一定记
lookup_resolve=1
lookup_log_all=0
lookup_log_watch=1

; 注入后多久再挂钩（毫秒），给客户端启动让路
install_delay_ms=800

; 启动后自动转储一次分发注册表（这张表就是"客户端认识哪些回包"的清单）
registry_dump_on_start=1
registry_dump_delay_ms=6000
; 转储时扫描的 opcode 上限（0..<=registry_scan_max）
registry_scan_max=4096

; 热键：游戏里按一下立刻重新转储注册表并写一行标记。
; 120 = F9，121 = F10。不想用热键就填 0。
hotkey_vk=120
