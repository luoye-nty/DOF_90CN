[probe]
; mode   : probe = ENTER/EXIT 汇总 + 逐件发送明细（默认，验证用这个）
;          quiet = 只记 ENTER/EXIT 汇总
;          off   = 完全不挂钩、不记录（等于没注入）
mode=probe

; logSends : 1 = 逐件打印 SEND235/SEND26（含 slot / ownerID / [mgr+0x7C]）
;            0 = 只记每趟的发送次数汇总，日志体积小很多
logSends=1

; control  : 1 = 同时挂钩 op26（NPC 分解机）那对函数作为对照组
;            想同一次登录里做 A/B 对比就保持 1：先按 NPC 分解机的"全部分解"，
;            再按个人商店分解机的"全部分解"，两条 EXIT 行一比就有答案
control=1

; autoRebase : 1 = 当声明地址的前导字节不匹配时，用函数特征码在模块内存里
;              重新定位（换客户端 build 时 RVA 会整体漂移）。只有特征码命中
;              **恰好 1 次**时才采用，命中 0 次或多次都保持声明地址不动。
;              日志里会打印每个函数特征码的命中次数与命中地址。
autoRebase=1
